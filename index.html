const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(IV)},key,d64(CT));
  return new TextDecoder().decode(pt);
}
async function tryOpen(pw,remember){
  try{const html=await open_(pw);
    try{if(remember)localStorage.setItem('pgt-pass',pw);}catch(e){}
    document.open();document.write(html);document.close();return true;
  }catch(e){return false}
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
  const b=document.getElementById('go');b.disabled=true;b.textContent='Apro…';
  const ok=await tryOpen(document.getElementById('pw').value,document.getElementById('rem').checked);
  if(!ok){b.disabled=false;b.textContent='Entra';document.getElementById('err').textContent='Password sbagliata.';}
});
(async()=>{let s=null;try{s=localStorage.getItem('pgt-pass')}catch(e){}
  if(s){const ok=await tryOpen(s,true);if(!ok){try{localStorage.removeItem('pgt-pass')}catch(e){}}}})();
