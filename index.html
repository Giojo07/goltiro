<title>Primo Gol Tiro</title>
<style>
:root{--bg:#0F1513;--card:#171F1C;--ink:#E6ECE8;--muted:#94A29B;--line:#2A3531;--accent:#F0663E;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:320px;display:grid;gap:18px;justify-items:center;text-align:center}
h1{margin:0;font-size:32px;letter-spacing:.01em;text-transform:uppercase;font-weight:800}h1 span{color:var(--accent)}
p{margin:0;color:var(--muted);font-size:15px}
.dots{display:flex;gap:14px;height:18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.err{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 28px system-ui,sans-serif;cursor:pointer}
.pad button:active{background:var(--accent);color:#fff}
.pad .ghost{background:transparent;border:0;font-size:16px;color:var(--muted)}
#msg{min-height:1.2em;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.dots.err{animation:none}}
</style></head><body>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unwrap(pin){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  for(const s of SLOTS){
    const kp=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(s.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(s.i)},kp,d64(s.w));return JSON.parse(new TextDecoder().decode(pt))}catch(e){}
  }
  return null;
}
async function enter(pin){
  const who=await unwrap(pin);if(!who)return false;
  const key=await crypto.subtle.importKey('raw',d64(who.k),'AES-GCM',false,['decrypt']);
  const ct=CTS[who.x||0];let html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(ct.i)},key,d64(ct.c)));
  html=html.replace('%%US'+'ER%%',JSON.stringify(who.n));
  try{localStorage.setItem('pgt-pin',pin)}catch(e){}
  document.open();document.write(html);document.close();return true;
}
let cur='';const dots=[...document.querySelectorAll('#dots i')],msg=document.getElementById('msg');
function show(){dots.forEach((d,i)=>d.classList.toggle('on',i<cur.length))}
async function press(v){
  if(v==='del'){cur=cur.slice(0,-1);show();return}
  if(cur.length>=4)return;cur+=v;show();
  if(cur.length===4){msg.textContent='Verifico…';const ok=await enter(cur);
    if(!ok){msg.textContent='PIN sbagliato';const el=document.getElementById('dots');el.classList.add('err');setTimeout(()=>el.classList.remove('err'),400);cur='';show()}}
}
document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;press(b.dataset.del?'del':b.textContent)});
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del')});
(async()=>{let p=null;try{p=localStorage.getItem('pgt-pin')}catch(e){}
  if(p){msg.textContent='Entro…';if(!(await enter(p))){try{localStorage.removeItem('pgt-pin')}catch(e){}msg.textContent=''}}})();
</script>
